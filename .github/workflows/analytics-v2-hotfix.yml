name: CATS analytics v2 frontend hotfix

on:
  push:
    branches:
      - hotfix/analytics-v2-20260920
    paths:
      - 'cats-analytics-v2.js'
      - 'auth-extra.js'
      - 'tests/analytics-v2.test.mjs'
      - '.github/workflows/analytics-v2-hotfix.yml'
  pull_request:
    paths:
      - 'cats-analytics-v2.js'
      - 'auth-extra.js'
      - 'tests/analytics-v2.test.mjs'

permissions:
  contents: read

jobs:
  analytics-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax gates
        run: |
          node --check cats-analytics-v2.js
          node --check auth-extra.js
      - name: Analytics V2 contract
        run: node tests/analytics-v2.test.mjs
      - name: Existing telemetry regressions
        run: |
          node tests/course-telemetry.test.mjs
          node tests/course-telemetry-adapter.test.mjs
          node tests/course-telemetry-ops.test.mjs
