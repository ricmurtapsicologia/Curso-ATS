name: Add CPF access hashes 20260914

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-cpf-access-20260914.yml'

permissions:
  contents: write

jobs:
  update-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add deduplicated CPF hashes to shared access
        shell: python
        run: |
          from pathlib import Path
          import base64
          import re

          TARGET_HEX = [
              'e183b2c36352f04f75e73e1e1062a79d244b34712e648b6fd420eb2f67e4da4c',
              '588ff7c7bd91e4c7b00a0116f8f0e5dd1e18892ac9d2354c11466594f92d2569',
              '3283d28d0e3c991d10da9dca843aa85c89668b9a0482b4daf198ad7c9de06289',
              'bcfbb4d9c8eb8a01e0fcc6dfb377733d6af7dcc058dc32c049a147769c9926e6',
              'b99374538f716fa0bb4f37ca149ff02bc32f8be98d0cb707171abb9db595a12e',
              '33c541ce5cfa43ed0447f67ea6ef96c65f61da257d56099451f8760ba56e34c7',
          ]

          auth_text = Path('auth.js').read_text(encoding='utf-8')
          auth_match = re.search(r'const HASH_B64\s*=\s*`([^`]*)`;', auth_text, re.S)
          if not auth_match:
              raise SystemExit('HASH_B64 not found in auth.js')
          raw = base64.b64decode(auth_match.group(1))
          if len(raw) % 32:
              raise SystemExit('Invalid canonical auth hash block')
          canonical = {raw[i:i+32].hex() for i in range(0, len(raw), 32)}

          path = Path('access-2026.js')
          text = path.read_text(encoding='utf-8')
          block = re.search(r'(const EXTRA_HASHES = new Set\(\[)(.*?)(\n\s*\]\);)', text, re.S)
          if not block:
              raise SystemExit('EXTRA_HASHES block not found')
          existing = set(re.findall(r'"([0-9a-f]{64})"', block.group(2)))

          to_add = [h for h in TARGET_HEX if h not in canonical and h not in existing]
          already = [h for h in TARGET_HEX if h in canonical or h in existing]

          if to_add:
              body = block.group(2).rstrip()
              if body and not body.rstrip().endswith(','):
                  body += ','
              addition = ''.join(f'\n    "{h}",' for h in to_add)
              body = body + addition
              body = body.rstrip(',')
              text = text[:block.start(2)] + body + text[block.end(2):]

          text = text.replace(
              '// 60 matrículas militares únicas; somente hashes SHA-256 são publicados.',
              '// Credenciais complementares únicas (matrículas de 7 dígitos e CPFs de 11 dígitos); somente hashes SHA-256 são publicados.'
          )
          text = text.replace(
              'if (!/^\\d{7}$/.test(credential)) return;',
              'if (!/^(?:\\d{7}|\\d{11})$/.test(credential)) return;'
          )

          path.write_text(text, encoding='utf-8')
          print(f'Canonical matches: {len([h for h in TARGET_HEX if h in canonical])}')
          print(f'Existing supplemental matches: {len([h for h in TARGET_HEX if h in existing])}')
          print(f'Added to shared supplemental access: {len(to_add)}')
          print(f'Already authorized without duplication: {len(already)}')

      - name: Commit shared access update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add access-2026.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Adiciona CPFs autorizados ao acesso compartilhado"
          git push
