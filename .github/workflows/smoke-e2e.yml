name: Smoke + E2E — Aulas ATS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-e2e.yml'
      - 'index.html'
      - 'app-core.js'
      - 'auth.js'
      - 'styles.css'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Smoke HTTP de produção
        run: |
          curl -fsS --retry 5 --retry-delay 3 --max-time 30 https://ricmurtapsicologia.github.io/Curso-ATS/ -o /tmp/page.html
          grep -q 'Atendimento a Tentativas de' /tmp/page.html
      - name: Instalar Chromium para E2E
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: E2E — acesso, conteúdo, interação e mobile
        run: |
          cat > /tmp/e2e.py <<'PY'
          from playwright.sync_api import sync_playwright

          URL='https://ricmurtapsicologia.github.io/Curso-ATS/'
          SESSION="""sessionStorage.setItem('curso_ats_auth_v3', JSON.stringify({authenticated:true,createdAt:Date.now(),expiresAt:Date.now()+8*60*60*1000,version:3})); localStorage.setItem('ric_analytics_consent','denied'); localStorage.setItem('curso-ats:onboarding-v2','1');"""

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page()
              response=page.goto(URL, wait_until='domcontentloaded', timeout=45000)
              assert response and response.ok, f'HTTP inválido: {response.status if response else "sem resposta"}'
              page.wait_for_timeout(1200)
              assert page.locator('#catsAuthGate').count() == 1, 'Gate de acesso não foi montado'
              page.close()

              ctx=browser.new_context(viewport={'width':1365,'height':900})
              ctx.add_init_script(SESSION)
              page=ctx.new_page()
              page.goto(URL, wait_until='networkidle', timeout=60000)
              page.wait_for_timeout(900)
              assert page.locator('.lesson-card').count() >= 4, 'Apresentações não renderizadas'
              assert page.locator('header.site-header').is_visible(), 'Hero principal não visível'
              assert page.locator('#splash-screen').evaluate("el => getComputedStyle(el).display === 'none'"), 'Splash não encerrou'
              how=page.locator('#how-to-btn')
              assert how.is_visible(), 'CTA de orientação ausente'
              how.click()
              page.wait_for_timeout(150)
              assert page.locator('#onboarding').is_visible(), 'Onboarding não abriu pelo CTA'
              page.locator('#skip-btn').click()
              materials=page.locator('#materials-btn')
              if materials.count():
                  materials.click()
                  page.wait_for_timeout(100)
                  assert page.locator('.hidden-links.is-visible').count() > 0, 'Materiais não abriram'
              ctx.close()

              ctx=browser.new_context(viewport={'width':390,'height':844})
              ctx.add_init_script(SESSION)
              mobile=ctx.new_page()
              mobile.goto(URL, wait_until='domcontentloaded', timeout=45000)
              mobile.wait_for_timeout(1000)
              overflow=mobile.evaluate('document.documentElement.scrollWidth - window.innerWidth')
              assert overflow <= 3, f'Overflow horizontal mobile: {overflow}px'
              assert mobile.locator('.lesson-card').count() >= 4
              ctx.close()
              browser.close()
          print('SMOKE_E2E_OK')
          PY
          python /tmp/e2e.py
