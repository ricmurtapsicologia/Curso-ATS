name: Smoke + E2E — Aulas ATS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-e2e.yml'
      - 'index.html'
      - 'app.js'
      - 'app-core.js'
      - 'auth.js'
      - 'access-2026.js'
      - 'access-hotfix-20260918.js'
      - 'auth-extra.js'
      - 'styles.css'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Smoke HTTP de produção
        run: |
          curl -fsS --retry 5 --retry-delay 3 --max-time 30 https://ricmurtapsicologia.github.io/Curso-ATS/ -o /tmp/page.html
          grep -q 'Atendimento a Tentativas de' /tmp/page.html
      - name: Confirmar credenciais publicadas
        run: |
          CANONICAL_HASH='b5575b8bb873f37cfcf809cd4b52747814a3ccdcd4a5fe1c6f8540dd37fdc6f3'
          HOTFIX_HASH='9bd0123c47240b15376c40dbc3066e9244ac82332870cc3eea0bc29cf19f922c'
          for i in {1..30}; do
            curl -fsS --max-time 30 "https://ricmurtapsicologia.github.io/Curso-ATS/access-2026.js?v=20260918-1" -o /tmp/access.js || true
            curl -fsS --max-time 30 "https://ricmurtapsicologia.github.io/Curso-ATS/access-hotfix-20260918.js?v=20260918-2" -o /tmp/hotfix.js || true
            if grep -q "$CANONICAL_HASH" /tmp/access.js 2>/dev/null && grep -q "$HOTFIX_HASH" /tmp/hotfix.js 2>/dev/null; then
              echo 'PASS: credenciais canônica e suplementar publicadas.'
              exit 0
            fi
            sleep 5
          done
          echo 'FAIL: hashes esperados ainda não apareceram na publicação.'
          exit 1
      - name: Instalar Chromium para E2E
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: E2E — gates públicos ATS, CATS e Podcast
        run: |
          cat > /tmp/e2e_gates.py <<'PY'
          from playwright.sync_api import sync_playwright

          targets = {
              'ATS': 'https://ricmurtapsicologia.github.io/Curso-ATS/',
              'CATS': 'https://ricmurtapsicologia.github.io/CATS.pousoalegre/',
              'PODCAST': 'https://ricmurtapsicologia.github.io/Podcast-ATS-CBMMG/',
          }

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for name, url in targets.items():
                  page = browser.new_page(viewport={'width': 1365, 'height': 900})
                  response = page.goto(url, wait_until='domcontentloaded', timeout=60000)
                  assert response and response.ok, f'{name}: HTTP inválido'
                  page.wait_for_selector('#catsAuthGate', timeout=15000)
                  page.wait_for_selector('#catsAuthInput', timeout=15000)
                  gate = page.locator('#catsAuthGate')
                  assert gate.is_visible(), f'{name}: gate não visível'
                  assert page.locator('#catsAuthForm').count() == 1, f'{name}: formulário ausente'
                  page.wait_for_function("document.querySelector('script[src*=\"access-hotfix-20260918.js\"]') !== null", timeout=20000)
                  print(f'PASS_GATE_{name}')
                  print(f'PASS_HOTFIX_LOADER_{name}')
                  page.close()
              browser.close()
          print('PASS_GATES_ALL')
          print('PASS_HOTFIX_ALL')
          PY
          python /tmp/e2e_gates.py
      - name: E2E — acesso, conteúdo, interação e mobile ATS
        run: |
          cat > /tmp/e2e.py <<'PY'
          from playwright.sync_api import sync_playwright

          URL='https://ricmurtapsicologia.github.io/Curso-ATS/'
          SESSION="""sessionStorage.setItem('curso_ats_auth_v3', JSON.stringify({authenticated:true,createdAt:Date.now(),expiresAt:Date.now()+8*60*60*1000,version:3})); localStorage.setItem('ric_analytics_consent','denied'); localStorage.setItem('curso-ats:onboarding-v2','1');"""

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page()
              response=page.goto(URL, wait_until='domcontentloaded', timeout=45000)
              assert response and response.ok, f'HTTP inválido: {response.status if response else "sem resposta"}'
              page.wait_for_timeout(1200)
              assert page.locator('#catsAuthGate').count() == 1, 'Gate de acesso não foi montado'
              page.close()

              ctx=browser.new_context(viewport={'width':1365,'height':900})
              ctx.add_init_script(SESSION)
              page=ctx.new_page()
              page.goto(URL, wait_until='domcontentloaded', timeout=45000)
              page.wait_for_selector('.lesson-card', timeout=20000)
              page.wait_for_timeout(900)
              assert page.locator('.lesson-card').count() >= 4, 'Apresentações não renderizadas'
              assert page.locator('header.site-header').is_visible(), 'Hero principal não visível'
              assert page.locator('#splash-screen').evaluate("el => getComputedStyle(el).display === 'none'"), 'Splash não encerrou'

              onboarding=page.locator('#onboarding')
              if onboarding.is_visible():
                  assert page.locator('#skip-btn').is_visible(), 'Onboarding automático sem controle de saída'
                  page.locator('#skip-btn').click()
                  page.wait_for_timeout(150)
                  assert not onboarding.is_visible(), 'Onboarding automático não fechou'

              how=page.locator('#how-to-btn')
              assert how.is_visible(), 'CTA de orientação ausente'
              how.click()
              page.wait_for_timeout(150)
              assert onboarding.is_visible(), 'Onboarding não abriu pelo CTA'
              page.locator('#skip-btn').click()
              page.wait_for_timeout(150)

              materials=page.locator('#materials-btn')
              if materials.count():
                  materials.click()
                  page.wait_for_timeout(100)
                  assert page.locator('.hidden-links.is-visible').count() > 0, 'Materiais não abriram'
              ctx.close()

              ctx=browser.new_context(viewport={'width':390,'height':844})
              ctx.add_init_script(SESSION)
              mobile=ctx.new_page()
              mobile.goto(URL, wait_until='domcontentloaded', timeout=45000)
              mobile.wait_for_selector('.lesson-card', timeout=20000)
              mobile.wait_for_timeout(1000)
              overflow=mobile.evaluate('document.documentElement.scrollWidth - window.innerWidth')
              assert overflow <= 3, f'Overflow horizontal mobile: {overflow}px'
              assert mobile.locator('.lesson-card').count() >= 4
              ctx.close()
              browser.close()
          print('SMOKE_E2E_OK')
          PY
          python /tmp/e2e.py
