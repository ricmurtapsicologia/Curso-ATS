name: Access — All Credentials E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/access-all-credentials-e2e.yml'
      - 'auth.js'
      - 'access-2026.js'
      - 'auth-extra.js'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  exhaustive-access:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: E2E — every authorized credential hash on all three public surfaces
        run: |
          cat > access-all-e2e.mjs <<'JS'
          import { chromium } from 'playwright';

          const stamp = Date.now();
          const BASE_URL = `https://ricmurtapsicologia.github.io/Curso-ATS/auth.js?all-e2e=${stamp}`;
          const EXTRA_URL = `https://ricmurtapsicologia.github.io/Curso-ATS/access-2026.js?all-e2e=${stamp}`;
          const targets = {
            ATS: 'https://ricmurtapsicologia.github.io/Curso-ATS/',
            CATS: 'https://ricmurtapsicologia.github.io/CATS.pousoalegre/',
            PODCAST: 'https://ricmurtapsicologia.github.io/Podcast-ATS-CBMMG/'
          };

          async function getText(url) {
            const r = await fetch(url, { cache: 'no-store' });
            if (!r.ok) throw new Error(`HTTP ${r.status} em ${url}`);
            return r.text();
          }

          function decodeBaseHashes(source) {
            const m = source.match(/const\s+HASH_B64\s*=\s*`([\s\S]*?)`/);
            if (!m) throw new Error('HASH_B64 não localizado em auth.js');
            const raw = Buffer.from(m[1].replace(/\s+/g, ''), 'base64');
            if (!raw.length || raw.length % 32 !== 0) throw new Error(`HASH_B64 inválido: ${raw.length} bytes`);
            const out = [];
            for (let i = 0; i < raw.length; i += 32) out.push(raw.subarray(i, i + 32).toString('hex'));
            return out;
          }

          function decodeExtraHashes(source) {
            const block = source.match(/const\s+EXTRA_HASHES\s*=\s*new\s+Set\s*\(\s*\[([\s\S]*?)\]\s*\)/);
            if (!block) throw new Error('EXTRA_HASHES não localizado em access-2026.js');
            return [...block[1].matchAll(/["']([a-f0-9]{64})["']/gi)].map(m => m[1].toLowerCase());
          }

          const [baseSource, extraSource] = await Promise.all([getText(BASE_URL), getText(EXTRA_URL)]);
          const base = decodeBaseHashes(baseSource);
          const extra = decodeExtraHashes(extraSource);
          const union = [...new Set([...base, ...extra])];

          if (base.length < 400) throw new Error(`Base inesperadamente pequena: ${base.length}`);
          if (extra.length < 1) throw new Error('Conjunto suplementar vazio');
          if (union.length < base.length) throw new Error('União inválida');

          console.log(`AUTHORIZED_COUNTS base=${base.length} supplemental=${extra.length} unique=${union.length}`);

          const browser = await chromium.launch({ headless: true });
          const failures = [];
          const CONCURRENCY = 8;

          async function testOne(surface, url, hash, index) {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            await context.route('**/*', async route => {
              const req = route.request();
              const type = req.resourceType();
              const u = req.url();
              if (['image', 'media', 'font'].includes(type)) return route.abort();
              if (u.includes('/api/analytics/') || u.includes('/api/course_telemetry')) {
                return route.fulfill({ status: 202, contentType: 'application/json', body: '{"ok":true}' });
              }
              return route.continue();
            });
            const bytes = hash.match(/../g).map(h => Number.parseInt(h, 16));
            await context.addInitScript(({ bytes }) => {
              const digest = new Uint8Array(bytes).buffer;
              Object.defineProperty(SubtleCrypto.prototype, 'digest', {
                configurable: true,
                value: async function () { return digest.slice(0); }
              });
            }, { bytes });

            const page = await context.newPage();
            try {
              const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
              if (!response?.ok()) throw new Error(`HTTP ${response?.status() ?? 'sem resposta'}`);
              await page.waitForSelector('#catsAuthInput', { timeout: 15000 });
              await page.waitForFunction(() => document.querySelector('script[src*="access-2026.js"]') !== null, null, { timeout: 15000 });
              await page.locator('#catsAuthInput').fill('0000000');
              await page.locator('#catsAuthForm').evaluate(form => form.requestSubmit());
              await page.waitForFunction(() => {
                for (let i = 0; i < sessionStorage.length; i += 1) {
                  const key = sessionStorage.key(i);
                  try {
                    const value = JSON.parse(sessionStorage.getItem(key) || 'null');
                    if (value?.authenticated === true) return true;
                  } catch {}
                }
                return false;
              }, null, { timeout: 6000 });
            } catch (error) {
              failures.push({ surface, index, hashPrefix: hash.slice(0, 10), error: String(error?.message || error) });
            } finally {
              await context.close();
            }
          }

          async function runSurface(surface, url) {
            let cursor = 0;
            const workers = Array.from({ length: CONCURRENCY }, async () => {
              while (true) {
                const index = cursor++;
                if (index >= union.length) return;
                await testOne(surface, url, union[index], index);
              }
            });
            await Promise.all(workers);
            const failedHere = failures.filter(f => f.surface === surface).length;
            if (failedHere) throw new Error(`${surface}: ${failedHere}/${union.length} credenciais falharam`);
            console.log(`PASS_ALL_${surface} ${union.length}/${union.length}`);
          }

          try {
            for (const [surface, url] of Object.entries(targets)) await runSurface(surface, url);
          } finally {
            await browser.close();
          }

          if (failures.length) {
            console.error('FAILURES', JSON.stringify(failures.slice(0, 25), null, 2));
            process.exit(1);
          }

          console.log(`PASS_ALL_CREDENTIALS_ALL_SURFACES unique=${union.length} checks=${union.length * Object.keys(targets).length}`);
          JS
          node ./access-all-e2e.mjs
