name: ATS Blueprint Execution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ats-blueprint-execute.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply-blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply neutral ATS platform hotfixes
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # 1) hardening: neutral titles, ITO original/vigente, noindex, runtime privacy copy
          p = Path('hardening.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const VERSION = "2026-09-20.1";', 'const VERSION = "2026-10-06.2";')
          s = s.replace('"Fundamentos do ATS","Fundamentos do Atendimento a Tentativas de Suicídio, comportamento suicida, crise, fatores associados e bases para atuação técnica."', '"Aspectos Gerais","Fundamentos do Atendimento a Tentativas de Suicídio, comportamento suicida, crise, fatores associados e bases para atuação técnica."')
          s = s.replace('"Abordagem Técnica no ATS","Aplicação da abordagem técnica em ATS, com foco em comunicação, vínculo, escuta e estratégias de intervenção."', '"Abordagem Técnica","Aplicação da abordagem técnica em ATS, com foco em comunicação, vínculo, escuta e estratégias de intervenção."')
          s = s.replace('"Cenários Específicos do ATS","Reconhecimento e intervenção em cenários específicos do ATS, considerando condições clínicas, comportamentais e operacionais."', '"Situações Específicas","Reconhecimento e intervenção em cenários específicos do ATS, considerando condições clínicas, comportamentais e operacionais."')
          s = s.replace('"Gerenciamento da Ocorrência de ATS","Gerenciamento da ocorrência de ATS, coordenação da cena, funções, planejamento e tomada de decisão."', '"Gerenciamento da Ocorrência","Gerenciamento da ocorrência de ATS, coordenação da cena, funções, planejamento e tomada de decisão."')
          s = s.replace('const ITO_2026_ID = "1uAauPvrL-VW3KmVScx-k0UKCnsenbaHC";', 'const ITO_2026_ID = ITO_OLD_ID;')
          s = s.replace('content:"index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"', 'content:"noindex,nofollow,noarchive"')
          s = s.replace('card.dataset.title = `Encontro ${index + 1}: ${title}`;', 'card.dataset.title = title;')
          s = s.replace('if (badge) badge.innerHTML = `<i class="ri-slideshow-2-line" aria-hidden="true"></i> Encontro ${index + 1} • 2026`;', 'if (badge) badge.innerHTML = `<i class="ri-slideshow-2-line" aria-hidden="true"></i> Apresentação • ATS`;')
          s = s.replace('a.textContent = "ITO Nº 30 — 2ª edição, revisão 2026 (v3.7 canônica)";', 'a.textContent = "ITO Nº 30 — edição vigente";')
          s = s.replace('a.dataset.canonicalSource = "ITO30-v3.7-2026";', 'a.dataset.canonicalSource = "ITO30-vigente";')
          s = s.replace('a.dataset.telemetryId = "ito-30-v3.7-2026";', 'a.dataset.telemetryId = "ito-30-vigente";')
          if 'function updatePrivacyCopy()' not in s:
              marker = '  function addShareButton() {'
              block = '''  function updatePrivacyCopy() {
    const body = document.querySelector("#privacyDialog .privacy-body");
    if (!body) return;
    body.innerHTML = `<p>Este ambiente registra dados técnicos e estatísticos agregados para segurança, disponibilidade e melhoria da plataforma. Quando há autenticação, a telemetria utiliza identificador pseudônimo.</p><p>Matrícula BM, CPF e credenciais não são armazenados em texto claro nos eventos de navegação. Serviços externos, como Google, YouTube, Google Drive e outros sites indicados na página, possuem políticas de privacidade próprias.</p>`;
  }

'''
              s = s.replace(marker, block + marker)
              s = s.replace('    addShareButton();\n    observeGate();', '    updatePrivacyCopy();\n    addShareButton();\n    observeGate();')
          write('hardening.js', s)

          # 2) robots: reduce casual discovery/indexing
          write('robots.txt', 'User-agent: *\nDisallow: /\n')

          # 3) index raw meta/copy: align with runtime where possible
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"', 'content="noindex,nofollow,noarchive"')
          s = s.replace('Este ambiente não realiza coleta analítica própria nesta versão. A integração anterior com Google Analytics foi desativada até que exista política formal de privacidade e consentimento explícito.', 'Este ambiente registra dados técnicos e estatísticos agregados para segurança, disponibilidade e melhoria da plataforma. Quando há autenticação, a telemetria utiliza identificador pseudônimo.')
          s = s.replace('O antigo chat externo foi removido para reduzir dependências, rastreamento e exposição de dados pessoais.', 'Matrícula BM, CPF e credenciais não são armazenados em texto claro nos eventos de navegação.')
          write('index.html', s)

          # 4) README: align key governance statements without rewriting the whole document
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('robots.txt` com bloqueio de rastreamento;', 'robots.txt` com bloqueio de rastreamento;')
          s = s.replace('meta `robots` e `googlebot` inseridas pela camada de saneamento com `noindex,nofollow,noarchive`;', 'meta `robots` e `googlebot` inseridas pela camada de saneamento com `noindex,nofollow,noarchive`;')
          if '## Regra editorial das apresentações ATS' not in s:
              s += '''

## Regra editorial das apresentações ATS

Os quatro PPTs principais são materiais-base neutros para uso por CFS, CFSD, CFO, CATS e outros cursos. A ITO 30 original/vigente permanece como base doutrinária. Alterações de conteúdo interno, imagens, vídeos, ordem de slides ou diagramação não fazem parte desta estabilização. A intervenção autorizada é exclusivamente a neutralização dos títulos das capas e a harmonização dos mesmos títulos na plataforma.

Títulos neutros vigentes:

1. Atendimento a Tentativas de Suicídio — Aspectos Gerais
2. Atendimento a Tentativas de Suicídio — Abordagem Técnica
3. Atendimento a Tentativas de Suicídio — Situações Específicas
4. Atendimento a Tentativas de Suicídio — Gerenciamento da Ocorrência
'''
          write('README.md', s)

          # 5) Access regression: cache-bust version must be semantically valid, not frozen to an old literal.
          p = Path('tests/access-policy-regression.test.mjs')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = s.replace("loader.includes('access-2026.js?v=20260920-v204')", "/access-2026\\.js\\?v=[A-Za-z0-9_.-]+/.test(loader)")
              s = s.replace("loader.includes('access-hotfix-20260918.js?v=20260920-v204')", "/access-hotfix-20260918\\.js\\?v=[A-Za-z0-9_.-]+/.test(loader)")
              write(p, s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          if [ -n "$(git status --porcelain)" ]; then
            git add hardening.js index.html robots.txt README.md tests/access-policy-regression.test.mjs
            git commit -m "Apply ATS platform blueprint hotfixes"
            git push
          else
            echo "No changes to commit."
          fi
