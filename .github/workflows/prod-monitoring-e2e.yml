name: Production Monitoring E2E

on:
  push:
    branches:
      - qa/prod-monitoring-e2e-20260919
    paths:
      - 'tests/prod-monitoring-e2e.mjs'
      - '.github/workflows/prod-monitoring-e2e.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: prod-monitoring-e2e
  cancel-in-progress: true

jobs:
  verify-four-surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Live production E2E — 4 monitored surfaces
        run: node tests/prod-monitoring-e2e.mjs

      - name: No deployment in E2E
        run: |
          echo 'PASS: validation only; no deploy action executed.'
